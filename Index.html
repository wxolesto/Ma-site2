/* Layout: one calm centered column, frosted-glass cards floating over soft blurred color fields; round controls; floating tab bar at the bottom. */
:root{
  --f-head:'Doran FaNum','Vazirmatn',system-ui,sans-serif;
  --f-body:'Vazirmatn','Doran FaNum',system-ui,sans-serif;
  --bg:#f5ebe6; --b1:#f0c9cc; --b2:#e6d3e8; --b3:#f6dfc6;
  --fg:#47323a; --muted:#8c7479; --accent:#a85f66; --accent-ink:#fff;
  --glass:rgba(255,255,255,.52); --glass2:rgba(255,255,255,.72); --stroke:rgba(255,255,255,.75); --hi:rgba(255,255,255,.9);
  --line:rgba(71,50,58,.10); --shadow:0 10px 30px rgba(120,70,80,.13);
  --ss:34%; --sl:56%;
  --s0:hsl(350 var(--ss) var(--sl)); --s1:hsl(28 var(--ss) var(--sl)); --s2:hsl(46 var(--ss) var(--sl)); --s3:hsl(140 var(--ss) var(--sl));
  --s4:hsl(175 var(--ss) var(--sl)); --s5:hsl(205 var(--ss) var(--sl)); --s6:hsl(250 var(--ss) var(--sl)); --s7:hsl(295 var(--ss) var(--sl));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1a2e; --b1:#21406e; --b2:#2c3068; --b3:#174a5e;
  --fg:#ece6da; --muted:#9ba6ba; --accent:#d9b98a; --accent-ink:#1c2433;
  --glass:rgba(255,255,255,.075); --glass2:rgba(255,255,255,.12); --stroke:rgba(255,255,255,.16); --hi:rgba(255,255,255,.22);
  --line:rgba(255,255,255,.10); --shadow:0 12px 34px rgba(0,0,0,.35); --sl:72%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a2e; --b1:#21406e; --b2:#2c3068; --b3:#174a5e;
  --fg:#ece6da; --muted:#9ba6ba; --accent:#d9b98a; --accent-ink:#1c2433;
  --glass:rgba(255,255,255,.075); --glass2:rgba(255,255,255,.12); --stroke:rgba(255,255,255,.16); --hi:rgba(255,255,255,.22);
  --line:rgba(255,255,255,.10); --shadow:0 12px 34px rgba(0,0,0,.35); --sl:72%; color-scheme:dark}
/* chosen palettes override system theme */
:root[data-palette="rose"]{--bg:#f5ebe6; --b1:#f0c9cc; --b2:#e6d3e8; --b3:#f6dfc6; --fg:#47323a; --muted:#8c7479; --accent:#a85f66; --accent-ink:#fff;
  --glass:rgba(255,255,255,.52); --glass2:rgba(255,255,255,.72); --stroke:rgba(255,255,255,.75); --hi:rgba(255,255,255,.9); --line:rgba(71,50,58,.10); --shadow:0 10px 30px rgba(120,70,80,.13); --sl:56%; color-scheme:light}
:root[data-palette="sage"]{--bg:#edf0e4; --b1:#cddcc2; --b2:#e3e6c6; --b3:#d3e4db; --fg:#2f3c2d; --muted:#6f7b69; --accent:#58774f; --accent-ink:#fff;
  --glass:rgba(255,255,255,.52); --glass2:rgba(255,255,255,.72); --stroke:rgba(255,255,255,.75); --hi:rgba(255,255,255,.9); --line:rgba(47,60,45,.10); --shadow:0 10px 30px rgba(70,90,60,.13); --sl:54%; color-scheme:light}
:root[data-palette="mist"]{--bg:#e9eff3; --b1:#c6d9e8; --b2:#dbd7ee; --b3:#cfe5e3; --fg:#2c3b4b; --muted:#6a7d8e; --accent:#4a7394; --accent-ink:#fff;
  --glass:rgba(255,255,255,.52); --glass2:rgba(255,255,255,.72); --stroke:rgba(255,255,255,.75); --hi:rgba(255,255,255,.9); --line:rgba(44,59,75,.10); --shadow:0 10px 30px rgba(60,90,120,.13); --sl:54%; color-scheme:light}
:root[data-palette="navy"]{--bg:#0f1a2e; --b1:#21406e; --b2:#2c3068; --b3:#174a5e; --fg:#ece6da; --muted:#9ba6ba; --accent:#d9b98a; --accent-ink:#1c2433;
  --glass:rgba(255,255,255,.075); --glass2:rgba(255,255,255,.12); --stroke:rgba(255,255,255,.16); --hi:rgba(255,255,255,.22); --line:rgba(255,255,255,.10); --shadow:0 12px 34px rgba(0,0,0,.35); --sl:72%; color-scheme:dark}
:root[data-palette="wine"]{--bg:#240f19; --b1:#5e2038; --b2:#3e1a37; --b3:#57322f; --fg:#f2e4dd; --muted:#bb9ca2; --accent:#e2a99d; --accent-ink:#2a1015;
  --glass:rgba(255,255,255,.07); --glass2:rgba(255,255,255,.115); --stroke:rgba(255,255,255,.15); --hi:rgba(255,255,255,.2); --line:rgba(255,255,255,.10); --shadow:0 12px 34px rgba(0,0,0,.38); --sl:72%; color-scheme:dark}

[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.7;
  padding-block:20px 150px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100%}
html[data-font="doran"]{--f-body:'Doran FaNum','Vazirmatn',system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.field{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg)}
.field i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.85;animation:drift 26s ease-in-out infinite alternate}
.field i:nth-child(1){width:60vmax;height:60vmax;background:var(--b1);top:-20vmax;right:-15vmax}
.field i:nth-child(2){width:55vmax;height:55vmax;background:var(--b2);bottom:-22vmax;left:-18vmax;animation-delay:-9s}
.field i:nth-child(3){width:38vmax;height:38vmax;background:var(--b3);top:38%;right:20%;animation-delay:-16s;opacity:.6}
@keyframes drift{to{transform:translate3d(4vmax,3vmax,0) scale(1.08)}}
@media (prefers-reduced-motion:reduce){.field i{animation:none}*{transition:none!important}}

.wrap{max-width:560px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);
  border:1px solid var(--stroke);box-shadow:var(--shadow),inset 0 1px 0 var(--hi);border-radius:28px}
.card{padding:16px 18px}
h1,h2,h3{font-family:var(--f-head);margin:0;font-weight:700;text-wrap:balance}
.muted{color:var(--muted)}

/* top */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-inline:4px}
.top h1{font-size:30px;line-height:1.3}
.top .sub{color:var(--muted);font-size:14px;margin-top:2px}
.rbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;transition:transform .2s,background .2s}
.rbtn:active{transform:scale(.92)}
.rbtn svg{width:21px;height:21px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;height:36px;padding-inline:14px;border-radius:99px;font-size:13.5px;
  background:var(--glass);border:1px solid var(--stroke);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);transition:background .2s,transform .2s}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.chip .dot{width:9px;height:9px;border-radius:50%}
.count{font-family:var(--f-head);font-weight:500}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:8px}
.day{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 7px;border-radius:22px;position:relative;transition:background .2s}
.day small{font-size:11.5px;color:var(--muted)}
.day b{font-family:var(--f-head);font-size:17px;font-weight:600;line-height:1.5}
.day em{width:5px;height:5px;border-radius:50%;background:transparent;margin-top:1px}
.day.has em{background:var(--muted);opacity:.55}
.day.full em{background:var(--accent);opacity:1}
.day.sel{background:var(--accent);color:var(--accent-ink)}
.day.sel small{color:inherit;opacity:.85}
.day.sel em{background:var(--accent-ink)}
.day.today:not(.sel) b{color:var(--accent)}

/* progress card */
.prog{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:84px;height:84px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{stroke:var(--line)}
.ring .pg{stroke:var(--accent);transition:stroke-dashoffset .6s cubic-bezier(.3,.7,.2,1)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-head);font-weight:700;font-size:19px}
.prog h3{font-size:17px}
.prog p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.bars{display:flex;gap:5px;margin-top:9px}
.bars i{height:6px;border-radius:9px;flex:1;background:var(--line);overflow:hidden;position:relative}
.bars i.on{background:var(--c)}

/* tasks */
.list{display:flex;flex-direction:column;gap:9px}
.task{display:flex;align-items:center;gap:13px;padding:11px 14px 11px 12px;border-radius:24px}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--c,var(--muted));flex:none;display:grid;place-items:center;transition:background .25s,transform .2s,border-color .25s;color:transparent}
.chk svg{width:16px;height:16px}
.chk:active{transform:scale(.88)}
.task.done .chk{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:#fff}
.tbody{flex:1;min-width:0;text-align:start;padding:2px 0}
.tbody strong{display:block;font-weight:500;font-size:15.5px;line-height:1.55;overflow-wrap:anywhere}
.tbody small{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--muted)}
.tbody small .sj{color:var(--c);filter:brightness(.88)}
.task.done .tbody strong{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.task.done{opacity:.75}
.empty{text-align:center;padding:30px 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h3{font-size:18px}
.empty p{margin:0;color:var(--muted);font-size:14px;max-width:30ch}
.hint{display:flex;align-items:center;gap:12px;font-size:13.5px;padding:12px 16px;border-radius:22px}
.hint span{flex:1}
.pill{height:38px;padding-inline:18px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-weight:500;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .2s,opacity .2s}
.pill:active{transform:scale(.96)}
.pill.soft{background:var(--glass2);color:var(--fg);border:1px solid var(--stroke)}
.pill.danger{background:transparent;color:var(--muted);border:1px solid var(--line)}
.pill svg{width:17px;height:17px}
.carry{align-self:center}

.rvh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rvh h3{font-size:17px}
.rvl{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.rv{display:flex;align-items:center;gap:13px;padding:8px 0;border-top:1px solid var(--line)}
.rv:first-child{border-top:0}
.rv .tbody{padding:0}
.rv .tbody strong{font-size:15px}
.lat{font-family:'Vazirmatn',system-ui,sans-serif;font-variant-numeric:tabular-nums}
.why{display:inline-flex;align-items:center;height:22px;padding-inline:9px;border-radius:99px;background:var(--line);color:var(--fg);font-size:11.5px}
.note{margin:2px 0 3px;font-size:13.5px;color:var(--muted);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* dock */
.dock{position:fixed;inset-inline:0;bottom:0;z-index:5;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:12px;
  padding:0 max(16px,env(safe-area-inset-left,0px),calc((100% - 560px)/2)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px),calc((100% - 560px)/2))}
.dock>*{pointer-events:auto}
.fab{align-self:flex-end;width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;
  box-shadow:0 12px 28px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .2s}
.fab:active{transform:scale(.92)}
.fab svg{width:26px;height:26px}
.tabs{display:flex;gap:3px;padding:6px;width:min(380px,100%);align-self:center}
.tabs button{flex:1;height:52px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-family:var(--f-head);font-size:12px;color:var(--muted);transition:background .25s,color .25s}
.tabs button svg{width:21px;height:21px}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

/* timer */
.timer{display:flex;flex-direction:column;align-items:center;gap:16px;padding:26px 18px 22px}
.tring{position:relative;width:min(250px,70vw);aspect-ratio:1}
.tring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tring .tr{stroke:var(--line)}
.tring .pg{stroke:var(--accent);transition:stroke-dashoffset .3s linear}
.tring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tring b{font-family:var(--f-head);font-weight:300;font-size:clamp(44px,14vw,58px);line-height:1.2;letter-spacing:.02em}
.tring span{color:var(--muted);font-size:14px}
.ctrl{display:flex;align-items:center;gap:16px}
.ctrl .rbtn{background:var(--glass2);border:1px solid var(--stroke)}
.ctrl .main{width:68px;height:68px;background:var(--accent);color:var(--accent-ink);border:0;box-shadow:0 10px 24px rgba(0,0,0,.2)}
.ctrl .main svg{width:28px;height:28px}
.seg{display:flex;padding:4px;gap:2px;border-radius:99px;background:var(--line)}
.seg button{height:34px;padding-inline:14px;border-radius:99px;font-size:13px;font-family:var(--f-head);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--glass2);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.lbl{font-size:13px;color:var(--muted);margin:0 4px 8px}

/* stats */
.cols{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:10px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.col i{width:100%;max-width:30px;border-radius:12px;background:var(--accent);opacity:.9;min-height:6px;transition:height .5s}
.col i.z{background:var(--line);opacity:1}
.col small{font-size:11.5px;color:var(--muted)}
.col .n{font-family:var(--f-head);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{padding:14px 10px;text-align:center;border-radius:24px}
.kpi b{display:block;font-family:var(--f-head);font-size:25px;font-weight:700;line-height:1.3}
.kpi small{color:var(--muted);font-size:12.5px}
.hrow{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13.5px}
.hrow .nm{width:78px;flex:none}
.hrow .bar{flex:1;height:10px;border-radius:9px;background:var(--line);overflow:hidden}
.hrow .bar i{display:block;height:100%;border-radius:9px;background:var(--c)}
.hrow .v{width:54px;text-align:end;color:var(--muted);font-family:var(--f-head);font-size:12.5px}

/* sheet */
#sheetWrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(10,10,20,.32);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fade .25s}
.sheet{position:relative;width:min(560px,100%);max-height:88%;overflow:auto;border-radius:32px 32px 0 0;background:var(--glass2);padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));
  margin-inline:0;animation:up .32s cubic-bezier(.2,.8,.2,1);border-bottom:0}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-size:20px;margin-bottom:14px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.inp{width:100%;height:48px;border-radius:18px;border:1px solid var(--line);background:var(--glass);padding-inline:16px;outline:none}
.inp:focus{border-color:var(--accent)}
textarea.inp{height:auto;min-height:130px;padding:12px 16px;resize:vertical;line-height:1.8}
.frm{display:flex;flex-direction:column;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.acts .pill{height:46px;padding-inline:22px}
.acts .grow{flex:1}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.sw{width:42px;height:42px;border-radius:50%;border:2px solid var(--stroke);box-shadow:var(--shadow);position:relative}
.sw[aria-pressed="true"]::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--accent)}
.set{display:flex;flex-direction:column;gap:8px}
.set>span{font-size:13px;color:var(--muted)}
.sel3{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px}
select.inp{appearance:none;-webkit-appearance:none;text-align:center;padding-inline:8px}
.sbadge{display:inline-flex;align-items:center;gap:6px;height:32px;padding-inline:12px;border-radius:99px;background:var(--glass);border:1px solid var(--line);font-size:13px}
.sbadge button{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.sbadge button svg{width:12px;height:12px}
.toast{position:fixed;inset-inline:0;top:calc(14px + env(safe-area-inset-top,0px));display:flex;justify-content:center;z-index:30;pointer-events:none}
.toast span{padding:10px 18px;border-radius:99px;background:var(--fg);color:var(--bg);font-size:13.5px;box-shadow:var(--shadow);animation:fade .25s}
</style>

</head>
<body>
<div id="app" dir="rtl" lang="fa">
  <div class="field" aria-hidden="true"><i></i><i></i><i></i></div>
  <main class="wrap" id="view"></main>
  <div class="dock">
    <button class="fab" id="fab" aria-label="افزودن کار" hidden></button>
    <nav class="tabs glass" role="tablist" aria-label="بخش‌ها">
      <button role="tab" data-tab="today"></button>
      <button role="tab" data-tab="timer"></button>
      <button role="tab" data-tab="mist"></button>
      <button role="tab" data-tab="stats"></button>
    </nav>
  </div>
  <div id="sheetWrap" hidden><div class="scrim" id="scrim"></div><div class="sheet glass" role="dialog" aria-modal="true" id="sheet"></div></div>
  <div class="toast" id="toast" aria-live="polite"></div>
</div>

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const fa=n=>Number(n).toLocaleString('fa-IR',{useGrouping:false});
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2],12)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const todayIso=()=>iso(new Date());
const J=(d,o)=>new Intl.DateTimeFormat('fa-IR-u-ca-persian',o).format(d);
const JEN=new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric'});
const jparts=d=>{const p={};JEN.formatToParts(d).forEach(x=>p[x.type]=x.value);return{y:+p.year,m:+p.month,d:+p.day}};
const MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const WD=['ش','ی','د','س','چ','پ','ج'];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const weekStart=d=>addDays(d,-((d.getDay()+1)%7));
function jToG(y,m,d){let c=addDays(new Date(),-400);for(let i=0;i<1400;i++){const p=jparts(c);if(p.y===y&&p.m===m&&p.d===d)return iso(c);c=addDays(c,1)}return null}

const IC={
 check:'<path d="M5 12.5l4.2 4.2L19 7"/>',plus:'<path d="M12 5v14M5 12h14"/>',gear:'<circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"/>',
 play:'<path d="M8 5.5v13l11-6.5z" fill="currentColor"/>',pause:'<path d="M8.5 5.5v13M15.5 5.5v13"/>',reset:'<path d="M4.5 12a7.5 7.5 0 1 0 2.3-5.4M4.5 4.5v4h4"/>',
 list:'<path d="M9 7h10M9 12h10M9 17h10"/><circle cx="5" cy="7" r=".6" fill="currentColor"/><circle cx="5" cy="12" r=".6" fill="currentColor"/><circle cx="5" cy="17" r=".6" fill="currentColor"/>',
 timer:'<circle cx="12" cy="13.5" r="7"/><path d="M12 10v3.8l2.4 1.4M9.5 3.5h5"/>',chart:'<path d="M5 20V11M12 20V5M19 20v-6"/>',
 x:'<path d="M6 6l12 12M18 6L6 18"/>',note:'<path d="M6.5 3.5h8l3.5 3.5v13.5h-11.5z"/><path d="M9.5 11h5.5M9.5 15h3.5"/>',next:'<path d="M5 12h14M13 6l-6 6 6 6"/>',flame:'<path d="M12 3c.5 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 .3 1.2 1 1.8 1.8 2C11 8.5 11 5.5 12 3z"/>'
};
const ic=(n,sw)=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(sw||2)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+'</svg>';

/* ---------- state ---------- */
const KEY='konkur-notebook-v1';
const SUBJ0=[['ریاضی'],['فیزیک'],['شیمی'],['زیست'],['ادبیات'],['عربی'],['دین و زندگی'],['زبان']].map((s,i)=>({id:'s'+i,n:s[0],c:i}));
let S=null, selDay=todayIso(), tab='today';

function seed(){
  const t=todayIso();
  const mk=(s,x,a)=>({id:uid(),t:x,s:'s'+s,a:a||'',n:'',done:false,ex:true});
  return {v:1,ts:0,reviews:[],mist:[],exam:null,palette:'auto',font:'vazir',subjects:SUBJ0,pomo:{f:25,b:5},study:{},
    tasks:{[t]:[mk(0,'حد و پیوستگی، تمرین‌های مبحثی','۳۰ تست'),mk(1,'مرور فصل دینامیک و حل مثال‌ها','۲ ساعت'),mk(3,'گوارش، خلاصه‌نویسی و نمودار','۱ ساعت'),mk(4,'آرایه‌های ادبی','۲۰ تست')]}};
}
function load(){
  try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.v===1)return o}}catch(e){}
  return seed();
}
S=load();S.reviews=S.reviews||[];S.mist=S.mist||[];
let saveTimer=null, dbDoc=null;
function save(){
  S.ts=Date.now();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    if(dbDoc){try{dbDoc.set(JSON.parse(JSON.stringify(S))).catch(()=>{})}catch(e){}}
  },350);
}
function applyLook(){
  const r=document.documentElement;
  if(S.palette&&S.palette!=='auto')r.dataset.palette=S.palette;else delete r.dataset.palette;
  r.dataset.font=S.font==='doran'?'doran':'vazir';
}
applyLook();

(async function connect(){
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();
    dbDoc=db.collection('data/users/'+id).doc('state');
    const snap=await dbDoc.get();
    if(snap.exists){
      const d=snap.data();
      if(d&&d.v===1&&(d.ts||0)>(S.ts||0)){S=d;S.reviews=S.reviews||[];S.mist=S.mist||[];applyLook();render()}
      else save();
    }else save();
  }catch(e){dbDoc=null}
})();

/* ---------- selectors ---------- */
const subj=id=>S.subjects.find(s=>s.id===id);
const subjColor=id=>{const s=subj(id);return 'var(--s'+(s?s.c%8:7)+')'};
const dayTasks=d=>S.tasks[d]||(S.tasks[d]=[]);
const stat=d=>{const l=S.tasks[d]||[];return{n:l.length,done:l.filter(t=>t.done).length}};
const studyMin=d=>Object.values(S.study[d]||{}).reduce((a,b)=>a+b,0);
const fmtMin=m=>m<60?fa(m)+' دقیقه':fa(Math.floor(m/60))+' ساعت'+(m%60?' و '+fa(m%60)+' دقیقه':'');
function toast(msg){const t=$('#toast');t.innerHTML='<span>'+esc(msg)+'</span>';clearTimeout(toast.h);toast.h=setTimeout(()=>t.innerHTML='',2200)}

/* ---------- spaced review ---------- */
const GAPS=[1,3,7,15];
function scheduleReview(x){
  const b=todayIso();S.reviews=S.reviews.filter(r=>r.f!==x.id);
  S.reviews.push({id:uid(),f:x.id,t:x.t,s:x.s,b:b,k:0,due:iso(addDays(parse(b),GAPS[0]))});
}
const dueReviews=d=>S.reviews.filter(r=>r.due===d||(d===todayIso()&&r.due<d)).sort((a,b)=>a.due<b.due?-1:1);
function doReview(id){
  const r=S.reviews.find(z=>z.id===id);if(!r)return;
  if(r.k>=GAPS.length-1){S.reviews=S.reviews.filter(z=>z!==r);toast('مرور این مبحث کامل شد')}
  else{
    r.k++;let d=iso(addDays(parse(r.b),GAPS[r.k]));
    if(d<=todayIso())d=iso(addDays(parse(todayIso()),1));
    r.due=d;toast('مرور ثبت شد. بعدی: '+J(parse(d),{day:'numeric',month:'long'}));
  }
  save();render();
}

/* ---------- views ---------- */
function ringSvg(p,r,w){const c=2*Math.PI*r;return '<svg viewBox="0 0 100 100"><circle class="tr" cx="50" cy="50" r="'+r+'" fill="none" stroke-width="'+w+'"/><circle class="pg" cx="50" cy="50" r="'+r+'" fill="none" stroke-width="'+w+'" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+(c*(1-p)).toFixed(1)+'"/></svg>'}

function countdown(){
  if(!S.exam)return '<button class="chip" data-act="settings">تاریخ کنکور رو تنظیم کن</button>';
  const n=Math.round((parse(S.exam)-parse(todayIso()))/864e5);
  if(n<0)return '<span class="chip">کنکور برگزار شد</span>';
  if(n===0)return '<span class="chip">امروز روز کنکوره، موفق باشی</span>';
  return '<span class="chip"><b class="count">'+fa(n)+'</b> روز تا کنکور</span>';
}

function viewToday(){
  const d=parse(selDay), t=todayIso(), list=dayTasks(selDay), st=stat(selDay);
  const ws=weekStart(d); let wk='';
  for(let i=0;i<7;i++){
    const x=addDays(ws,i), k=iso(x), s=stat(k);
    wk+='<button class="day'+(k===selDay?' sel':'')+(k===t?' today':'')+(s.n?' has':'')+(s.n&&s.done===s.n?' full':'')+'" data-day="'+k+'" aria-label="'+esc(J(x,{weekday:'long',day:'numeric',month:'long'}))+'"><small>'+WD[i]+'</small><b>'+fa(jparts(x).d)+'</b><em></em></button>';
  }
  const pct=st.n?st.done/st.n:0;
  const segs=list.map(x=>'<i class="'+(x.done?'on':'')+'" style="--c:'+subjColor(x.s)+'"></i>').join('');
  const isToday=selDay===t;
  const title=isToday?'امروز':J(d,{weekday:'long'});
  const sub=J(d,{day:'numeric',month:'long',year:'numeric'});
  const mins=studyMin(selDay);
  const left=list.filter(x=>!x.done).length;
  const rv=dueReviews(selDay);
  const rvHtml=rv.length?'<section class="glass card"><div class="rvh"><h3>مرور امروز</h3><span class="chip"><b class="count">'+fa(rv.length)+'</b> مبحث</span></div><div class="rvl">'+rv.map(r=>{
    const late=Math.round((parse(selDay)-parse(r.due))/864e5);const sb=subj(r.s);
    return '<div class="rv" style="--c:'+subjColor(r.s)+'"><button class="chk" data-rev="'+r.id+'" aria-label="مرور شد">'+ic('check',3)+'</button><div class="tbody"><strong>'+esc(r.t)+'</strong><small><span class="sj">'+esc(sb?sb.n:'سایر')+'</span><span>مرور '+fa(r.k+1)+' از '+fa(GAPS.length)+'</span>'+(late>0?'<span>'+fa(late)+' روز عقب‌افتاده</span>':'')+'</small></div></div>';
  }).join('')+'</div></section>':'';
  const hasEx=Object.values(S.tasks).some(l=>l.some(x=>x.ex));
  let body='';
  if(!list.length){
    body='<div class="glass empty"><h3>این روز خالیه</h3><p>کارهای برنامه مشاورت رو اینجا اضافه کن. می‌تونی کل برنامه رو یکجا بچسبونی.</p><button class="pill" data-act="add">'+ic('plus')+'افزودن کار</button></div>';
  }else{
    body='<div class="list">'+list.map(x=>{
      const s=subj(x.s);
      return '<div class="glass task'+(x.done?' done':'')+'" style="--c:'+subjColor(x.s)+'"><button class="chk" data-tog="'+x.id+'" aria-label="'+(x.done?'برگردوندن':'انجام شد')+'">'+ic('check',3)+'</button>'+
        '<button class="tbody" data-edit="'+x.id+'"><strong>'+esc(x.t)+'</strong><small><span class="sj">'+esc(s?s.n:'سایر')+'</span>'+(x.a?'<span>'+esc(x.a)+'</span>':'')+(x.n?'<span>یادداشت</span>':'')+'</small></button></div>';
    }).join('')+'</div>';

/* ---------- timer ---------- */
const T={mode:'f',remain:25*60,running:false,end:0,subj:null,elapsed:0,iv:null};
T.subj=S.subjects[0]&&S.subjects[0].id;
const tTotal=()=>(T.mode==='f'?S.pomo.f:S.pomo.b)*60;
function resetTimer(){clearInterval(T.iv);T.running=false;T.remain=tTotal();paintTimer()}
function logStudy(min){
  if(min<1||!T.subj)return;
  const d=todayIso();const m=S.study[d]||(S.study[d]={});m[T.subj]=(m[T.subj]||0)+min;save();
}
function tick(){
  const r=Math.max(0,Math.round((T.end-Date.now())/1000));
  T.remain=r;
  if(r<=0){
    clearInterval(T.iv);T.running=false;
    if(T.mode==='f'){logStudy(S.pomo.f);toast('یه دور تمرکز ثبت شد. استراحت کن');T.mode='b'}else{toast('استراحت تموم شد');T.mode='f'}
    T.elapsed=0;T.remain=tTotal();
  }
  paintTimer();
}
function paintTimer(){
  const tm=$('#tTime');if(!tm)return;
  const m=Math.floor(T.remain/60),s=T.remain%60;
  tm.textContent=pad(m)+':'+pad(s);
  $('#tMode').textContent=T.mode==='f'?'تمرکز':'استراحت';
  const c=2*Math.PI*46;$('#tRing .pg').setAttribute('stroke-dashoffset',(c*(1-T.remain/tTotal())).toFixed(1));
  const mb=$('#tMain');mb.innerHTML=ic(T.running?'pause':'play',2.4);mb.setAttribute('aria-label',T.running?'توقف':'شروع');
  $('#tSub').textContent='امروز '+(studyMin(todayIso())?fmtMin(studyMin(todayIso()))+' مطالعه':'هنوز چیزی ثبت نشده');
}
function toggleTimer(){
  if(T.running){clearInterval(T.iv);T.running=false;T.remain=Math.max(0,Math.round((T.end-Date.now())/1000))}
  else{T.end=Date.now()+T.remain*1000;T.running=true;T.iv=setInterval(tick,500)}
  paintTimer();
}
function saveStudy(){
  if(T.mode!=='f'){resetTimer();return}
  const done=Math.floor((tTotal()-T.remain)/60);
  if(done<1){toast('هنوز یک دقیقه هم نشده');return}
  logStudy(done);toast(fa(done)+' دقیقه مطالعه ثبت شد');
  resetTimer();
}

   '<div class="set"><span>تم</span><div class="swatches" id="sSw">'+P.map(p=>'<button class="sw" data-p="'+p[0]+'" style="background:'+p[1]+'" aria-label="'+p[2]+'" title="'+p[2]+'" aria-pressed="'+(S.palette===p[0])+'"></button>').join('')+'</div></div>'+
   '<div class="set"><span>فونت متن‌ها</span><div class="seg" id="sFont" style="align-self:flex-start"><button data-f="vazir" aria-pressed="'+(S.font!=='doran')+'">وزیرمتن</button><button data-f="doran" aria-pressed="'+(S.font==='doran')+'">دوران</button></div></div>'+
   '<div class="set"><span>تاریخ کنکور</span><div class="sel3"><select class="inp" id="xD" aria-label="روز">'+Array.from({length:31},(_,i)=>'<option value="'+(i+1)+'"'+(ex.d===i+1?' selected':'')+'>'+fa(i+1)+'</option>').join('')+'</select><select class="inp" id="xM" aria-label="ماه">'+MONTHS.map((m,i)=>'<option value="'+(i+1)+'"'+(ex.m===i+1?' selected':'')+'>'+m+'</option>').join('')+'</select><select class="inp" id="xY" aria-label="سال">'+yrs.map(y=>'<option value="'+y+'"'+(ex.y===y?' selected':'')+'>'+fa(y)+'</option>').join('')+'</select></div><div class="acts"><button class="pill" id="xSave">ذخیره تاریخ</button>'+(S.exam?'<button class="pill danger" id="xClr">حذف تاریخ</button>':'')+'</div></div>'+
   '<div class="set"><span>درس‌ها</span><div class="chips" id="sSub">'+S.subjects.map(s=>'<span class="sbadge"><i class="dot" style="width:9px;height:9px;border-radius:50%;background:var(--s'+(s.c%8)+')"></i>'+esc(s.n)+'<button data-rm="'+s.id+'" aria-label="حذف '+esc(s.n)+'">'+ic('x',2.6)+'</button></span>').join('')+'</div><div style="display:flex;gap:8px"><input class="inp" id="sNew" placeholder="درس جدید" maxlength="20" autocomplete="off"><button class="pill" id="sAdd" style="height:48px">افزودن</button></div></div>'+
   '</div>',
  root=>{
    root.addEventListener('click',e=>{
      const p=e.target.closest('[data-p]');if(p){S.palette=p.dataset.p;applyLook();save();$$('#sSw .sw',root).forEach(x=>x.setAttribute('aria-pressed',x===p))}
      const f=e.target.closest('[data-f]');if(f){S.font=f.dataset.f;applyLook();save();$$('#sFont button',root).forEach(x=>x.setAttribute('aria-pressed',x===f))}
      const rm=e.target.closest('[data-rm]');if(rm){if(S.subjects.length<=1){toast('حداقل یک درس لازمه');return}S.subjects=S.subjects.filter(s=>s.id!==rm.dataset.rm);if(!subj(T.subj))T.subj=S.subjects[0].id;save();settingsSheet();render()}
    });
    $('#xSave',root).addEventListener('click',()=>{
      const g=jToG(+$('#xY',root).value,+$('#xM',root).value,+$('#xD',root).value);
      if(!g){toast('این تاریخ معتبر نیست');return}
      S.exam=g;save();closeSheet();render();toast('تاریخ کنکور ذخیره شد');
    });
    const clr=$('#xClr',root);if(clr)clr.addEventListener('click',()=>{S.exam=null;save();closeSheet();render()});
    const add=()=>{
      const v=$('#sNew',root).value.trim();if(!v)return;
      if(S.subjects.some(s=>s.n===v)){toast('این درس هست');return}
      const used=S.subjects.map(s=>s.c);let c=0;while(used.includes(c)&&c<7)c++;
      S.subjects.push({id:'s'+uid(),n:v,c:c});save();settingsSheet();render();
    };
    $('#sAdd',root).addEventListener('click',add);
    $('#sNew',root).addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();add()}});
  });
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;render();window.scrollTo({top:0});return}
  if(t.id==='fab'){tab==='mist'?mistSheet(null):taskSheet(null);return}
  if(t.dataset.act==='add'){taskSheet(null);return}
  if(t.dataset.act==='addm'){mistSheet(null);return}
  if(t.dataset.medit){mistSheet(t.dataset.medit);return}
  if(t.dataset.mfix){const m=S.mist.find(x=>x.id===t.dataset.mfix);if(m){m.fx=!m.fx;save();render();if(m.fx)toast('آفرین، این غلط رفع شد')}return}
  if(t.dataset.mf){MF.open=!MF.open;render();return}
  if(t.dataset.ms){MF.s=t.dataset.ms;render();return}
  if(t.dataset.act==='settings'){settingsSheet();return}
  if(t.dataset.day){selDay=t.dataset.day;render();return}
  if(t.dataset.rev){doReview(t.dataset.rev);return}
  if(t.dataset.tog){const x=dayTasks(selDay).find(z=>z.id===t.dataset.tog);if(x){x.done=!x.done;delete x.ex;
    if(x.done){if(x.r!==false){scheduleReview(x);toast('مرور فردا برات ثبت شد')}}
    else S.reviews=S.reviews.filter(r=>!(r.f===x.id&&r.k===0));
    save();render()}return}
  if(t.dataset.edit){taskSheet(t.dataset.edit);return}
  if(t.dataset.act==='clearex'){for(const k in S.tasks)S.tasks[k]=S.tasks[k].filter(x=>!x.ex);save();render();return}
  if(t.dataset.act==='carry'){
    const to=iso(addDays(parse(selDay),1)),keep=[],mv=[];
    dayTasks(selDay).forEach(x=>(x.done?keep:mv).push(x));
    S.tasks[selDay]=keep;mv.forEach(x=>dayTasks(to).push(x));save();render();toast(fa(mv.length)+' کار به فردا رفت');return}
  if(t.dataset.pre){const p=t.dataset.pre.split(',').map(Number);S.pomo={f:p[0],b:p[1]};save();T.mode='f';resetTimer();$$('#tPre button').forEach(b=>b.setAttribute('aria-pressed',b===t));return}
  if(t.dataset.tsub){T.subj=t.dataset.tsub;$$('#tSubj .chip').forEach(b=>b.setAttribute('aria-pressed',b===t));return}
  if(t.dataset.t==='toggle'){toggleTimer();return}
  if(t.dataset.t==='reset'){resetTimer();return}
  if(t.dataset.t==='save'){saveStudy();return}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&T.running)tick()});

render();
})();
</script>
